# Adds the label that starts the Kokoro presubmit jobs to pull requests from
# dependency bots. Kokoro starts a job by itself only for pull requests from
# repository collaborators, so a bot pull request gets no Kokoro check without
# this label. Kokoro removes the label when a job starts.
name: Kokoro label for dependency bot pull requests

on:
  # pull_request_target gives a token that can add a label to a pull request
  # from a fork. This workflow does not check out or run code from the pull
  # request, and it uses no value from the pull request in a script.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize]
    branches: [master]

permissions: {}

jobs:
  label:
    if: >-
      github.event.pull_request.user.login == 'renovate-bot' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add the kokoro:force-run label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" \
            -f "labels[]=kokoro:force-run" --jq '[.[].name] | join(", ")'
